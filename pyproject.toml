[project]
name = "mikiui"
version = "0.1.0"
description = "Python-first UI framework that renders UIs as standalone desktops or websites."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "click>=8.1",
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.scripts]
mikiui = "mikiui.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mikiui*", "mikiui_app_plugins*"]

[tool.setuptools.package-data]
mikiui = ["runtime/*.js", "runtime/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
