name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build,desktop,tailwind]"
          pip install pytest-playwright
          playwright install --with-deps chromium

      - name: Lint with ruff
        run: ruff check mikiui/ tests/

      - name: Type check with mypy
        run: mypy mikiui/

      - name: Run unit tests
        run: python -m pytest tests/ -q --no-cov --ignore=tests/e2e

      - name: Run E2E tests
        run: python -m pytest tests/e2e/ -q --no-cov
        timeout-minutes: 15

      - name: Security scan with bandit
        run: bandit -r mikiui/ -ll

      - name: Build check (web)
        run: python -c "from mikiui.build.web_build import build_web; print('Web build OK')"

      - name: Build check (desktop)
        run: python -c "from mikiui.build.desktop_build import build_desktop; print('Desktop build OK')"
